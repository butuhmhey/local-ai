<body>
  <div id="app"></div>
  <script>
    // Crash catcher — if the JS bundle fails to load, show a visible message
    // instead of a silent blank screen.
    window.__EMBER_CRASH__ = null;
    window.addEventListener('error', e => { window.__EMBER_CRASH__ = e.message || String(e); });
    window.addEventListener('unhandledrejection', e => { window.__EMBER_CRASH__ = 'Unhandled rejection: ' + (e.reason?.message || e.reason); });
    (function poll() {
      var app = document.getElementById('app');
      setTimeout(function () {
        if (app && app.children.length === 0 && window.__EMBER_CRASH__) {
          app.innerHTML = '<div style="max-width:480px;margin:20vh auto;padding:32px;font-family:system-ui;text-align:center">' +
            '<h1 style="font-size:22px;margin:0 0 8px">Ember couldn&rsquo;t start</h1>' +
            '<p style="color:#666;word-break:break-word">' + window.__EMBER_CRASH__ + '</p>' +
            '<button onclick="location.reload()" style="margin-top:16px;padding:10px 18px;border:0;border-radius:10px;background:#D97706;color:#fff;font-size:14px;cursor:pointer">Reload</button>' +
            '</div>';
        } else if (app && app.children.length === 0) {
          poll();
        }
      }, 400);
    })();
  </script>
</body>
